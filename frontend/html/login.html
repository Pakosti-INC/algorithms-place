<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | УрФУ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <header class="auth-header">
            <div class="auth-logo">Алгоритмы / Практикум</div>
            <h1 class="auth-title">Вход в систему</h1>
            <p class="auth-subtitle">
                Чтобы воспользоваться нашими сервисами, необходима авторизация.
            </p>
        </header>

        <main class="auth-card">
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Почта пользователя</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        class="form-input"
                        required
                        placeholder="Например: user@example.com"
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        class="form-input"
                        required
                        placeholder="••••••••••••"
                    >
                </div>

                <p id="error-msg" class="form-error hidden"></p>

                <button type="submit" class="btn-submit">Войти в платформу</button>
            </form>

            <div class="auth-divider-block">
                <div class="auth-divider">
                    <span>Нет аккаунта или возникли проблемы?</span>
                </div>

                <div class="auth-help">
                    <p>Впервые на платформе?</p>
                    <a href="reg.html" class="auth-link">Зарегистрироваться</a>
                </div>
            </div>
        </main>

        <footer class="page-footer">
            &copy; 2026 Алгоритмы / Практикум.
        </footer>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
