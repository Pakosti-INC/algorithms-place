<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | УрФУ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <!-- Логотип -->
        <div class="flex justify-center mb-6">
            <div class="font-bold text-4xl text-[#003366] tracking-tight">УрФУ</div>
        </div>
        <h2 class="mt-2 text-center text-2xl font-bold text-slate-900">Вход в систему</h2>
        <p class="mt-2 text-center text-sm text-slate-500 max-w-sm mx-auto">
            Чтобы воспользоваться сервисами НТИ (филиал) УрФУ, необходима авторизация.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-[0_8px_30px_rgb(0,0,0,0.04)] sm:rounded-2xl sm:px-10 border border-slate-100">
            <form id="login-form" class="space-y-6">

                <!-- Имя пользователя -->
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700">Имя пользователя</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required placeholder="Например: karaev-sr"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-colors sm:text-sm">
                    </div>
                </div>

                <!-- Пароль -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700">Пароль</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required placeholder="••••••••••••"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 rounded-lg shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-colors sm:text-sm">
                    </div>
                </div>

                <!-- Выбор домена -->
                <div>
                    <label for="domain" class="block text-sm font-medium text-slate-700">Домен</label>
                    <div class="mt-1 relative">
                        <select id="domain" name="domain"
                            class="appearance-none block w-full px-4 py-3 border border-slate-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-colors sm:text-sm bg-white cursor-pointer">
                            <option>Я студент / школьник</option>
                            <option>Я преподаватель / сотрудник</option>
                        </select>
                        <!-- Кастомная стрелочка для селекта -->
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Кнопка Вход -->
                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-[#F26522] hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition-colors">
                        Войти в платформу
                    </button>
                </div>
            </form>

            <!-- Ссылки под формой (восстановление пароля) -->
            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-slate-500">Возникли проблемы?</span>
                    </div>
                </div>

                <div class="mt-6 text-center text-sm">
                    <p class="text-slate-500">Не помните свой пароль или имя пользователя?</p>
                    <a href="#" class="font-medium text-[#003366] hover:text-orange-500 transition-colors mt-1 inline-block">
                        Перейти на сайт самообслуживания
                    </a>
                </div>
            </div>
        </div>

        <!-- Подвал (footer) страницы входа -->
        <p class="mt-8 text-center text-xs text-slate-400">
            &copy; 2024 Нижнетагильский технологический институт (филиал) УрФУ.
        </p>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
