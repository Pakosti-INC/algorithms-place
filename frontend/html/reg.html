<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | УрФУ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="auth-page">

    <div class="auth-wrapper">
        <header class="auth-header">
            <div class="auth-logo">УрФУ</div>
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">
                Создайте учетную запись студента для доступа к курсу алгоритмов.
            </p>
        </header>

        <main class="auth-card">
            <form id="reg-form" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="last-name" class="form-label">Фамилия</label>
                        <input id="last-name" name="last_name" type="text" class="form-input" required placeholder="Караев">
                    </div>

                    <div class="form-group">
                        <label for="first-name" class="form-label">Имя</label>
                        <input id="first-name" name="first_name" type="text" class="form-input" required placeholder="Алексей">
                    </div>
                </div>

                <div class="form-group">
                    <label for="middle-name" class="form-label">Отчество</label>
                    <input id="middle-name" name="middle_name" type="text" class="form-input" required placeholder="Сергеевич">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Электронная почта</label>
                    <input id="email" name="email" type="email" class="form-input" required placeholder="user@example.com">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input id="password" name="password" type="password" class="form-input" required placeholder="••••••••••••">
                </div>

                <p id="error-msg" class="form-error hidden"></p>

                <button type="submit" class="btn-submit">Создать аккаунт</button>
            </form>

            <div class="auth-divider-block">
                <div class="auth-divider">
                    <span>Уже зарегистрированы?</span>
                </div>

                <div class="auth-help">
                    <a href="login.html" class="auth-link">Войти в систему</a>
                </div>
            </div>
        </main>

        <footer class="page-footer">
            &copy; 2026 Нижнетагильский технологический институт (филиал) УрФУ.
        </footer>
    </div>

    <script src="../js/reg.js"></script>
</body>
</html>
